<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 190" role="img" aria-label="每个位置等权；平均得到一个标量，并没有减少预测位置数量。"><style>svg{background:#f8fafc;color:#26354a;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}text{font-family:inherit}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#536d92"/></marker></defs><rect x="50" y="35" width="92" height="42" rx="7" fill="#edf3fc" stroke="#bccbdc"/><text x="96" y="61" font-size="15" fill="#26354a" text-anchor="middle">0.2</text><rect x="145" y="35" width="92" height="42" rx="7" fill="#edf3fc" stroke="#bccbdc"/><text x="191" y="61" font-size="15" fill="#26354a" text-anchor="middle">0.4</text><rect x="240" y="35" width="92" height="42" rx="7" fill="#edf3fc" stroke="#bccbdc"/><text x="286" y="61" font-size="15" fill="#26354a" text-anchor="middle">0.9</text><text x="192" y="103" font-size="15" fill="#26354a" text-anchor="middle">三个有效位置</text><path d="M345,57 L410,57" fill="none" stroke="#536d92" stroke-width="2" marker-end="url(#arrow)"/><rect x="420" y="35" width="230" height="42" rx="7" fill="#edf3fc" stroke="#bccbdc"/><text x="535" y="61" font-size="15" fill="#26354a" text-anchor="middle">(0.2 + 0.4 + 0.9) ÷ 3</text><text x="535" y="118" font-size="19" fill="#26354a" text-anchor="middle">平均损失 = 0.5</text><text x="350" y="176" font-size="14" fill="#26354a" text-anchor="middle">分子和分母必须覆盖同一组有效目标。</text></svg>
