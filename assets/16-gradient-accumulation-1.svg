<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 255" role="img" aria-label="箭头表示梯度贡献汇入同一存储；等大小、等权有效目标下，得到八条样本的平均贡献。"><style>svg{background:#f8fafc;color:#26354a;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}text{font-family:inherit}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#536d92"/></marker></defs><text x="350" y="20" font-size="15" fill="#26354a" text-anchor="middle">同一份固定参数，分 4 个微批收集贡献</text><rect x="25" y="42" width="150" height="50" rx="7" fill="#edf3fc" stroke="#bccbdc"/><text x="100" y="72" font-size="15" fill="#26354a" text-anchor="middle">微批1：2 条</text><path d="M100,122 L100,145" fill="none" stroke="#536d92" stroke-width="2" marker-end="url(#arrow)"/><text x="100" y="118" font-size="13" fill="#26354a" text-anchor="middle">平均梯度 ÷ 4</text><rect x="198" y="42" width="150" height="50" rx="7" fill="#edf3fc" stroke="#bccbdc"/><text x="273" y="72" font-size="15" fill="#26354a" text-anchor="middle">微批2：2 条</text><path d="M273,122 L273,145" fill="none" stroke="#536d92" stroke-width="2" marker-end="url(#arrow)"/><text x="273" y="118" font-size="13" fill="#26354a" text-anchor="middle">平均梯度 ÷ 4</text><rect x="371" y="42" width="150" height="50" rx="7" fill="#edf3fc" stroke="#bccbdc"/><text x="446" y="72" font-size="15" fill="#26354a" text-anchor="middle">微批3：2 条</text><path d="M446,122 L446,145" fill="none" stroke="#536d92" stroke-width="2" marker-end="url(#arrow)"/><text x="446" y="118" font-size="13" fill="#26354a" text-anchor="middle">平均梯度 ÷ 4</text><rect x="544" y="42" width="150" height="50" rx="7" fill="#edf3fc" stroke="#bccbdc"/><text x="619" y="72" font-size="15" fill="#26354a" text-anchor="middle">微批4：2 条</text><path d="M619,122 L619,145" fill="none" stroke="#536d92" stroke-width="2" marker-end="url(#arrow)"/><text x="619" y="118" font-size="13" fill="#26354a" text-anchor="middle">平均梯度 ÷ 4</text><path d="M100 134 L100 150 L619 150 L619 134" fill="none" stroke="#536d92" stroke-width="2"/><path d="M350,150 L350,175" fill="none" stroke="#536d92" stroke-width="2" marker-end="url(#arrow)"/><rect x="205" y="180" width="290" height="42" rx="7" fill="#edf3fc" stroke="#bccbdc"/><text x="350" y="206" font-size="15" fill="#26354a" text-anchor="middle">累计 g₁/4 + g₂/4 + g₃/4 + g₄/4</text><text x="350" y="249" font-size="14" fill="#26354a" text-anchor="middle">开始前清理一次 → 四次反向累加 → 最后更新一次</text></svg>
