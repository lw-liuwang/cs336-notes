<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" role="img" aria-label="每一列权重生成一个输出分量；批次与位置维度被保留。"><style>svg{background:#f8fafc;color:#26354a;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}text{font-family:inherit}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#536d92"/></marker></defs><text x="135" y="24" font-size="15" fill="#26354a" text-anchor="middle">任意一个位置</text><rect x="35" y="55" width="200" height="45" rx="7" fill="#edf3fc" stroke="#bccbdc"/><text x="135" y="82.5" font-size="15" fill="#26354a" text-anchor="middle">8 个输入数</text><rect x="290" y="45" width="160" height="75" rx="7" fill="#edf3fc" stroke="#bccbdc"/><text x="370" y="87.5" font-size="15" fill="#26354a" text-anchor="middle">W：8 行 × 10 列</text><path d="M235,78 L285,78" fill="none" stroke="#536d92" stroke-width="2" marker-end="url(#arrow)"/><path d="M450,78 L495,78" fill="none" stroke="#536d92" stroke-width="2" marker-end="url(#arrow)"/><rect x="500" y="55" width="170" height="45" rx="7" fill="#edf3fc" stroke="#bccbdc"/><text x="585" y="82.5" font-size="15" fill="#26354a" text-anchor="middle">10 个输出数</text><text x="370" y="145" font-size="15" fill="#26354a" text-anchor="middle">同一个 W 供 2 × 6 = 12 个位置使用</text><text x="350" y="187" font-size="15" fill="#26354a" text-anchor="middle">(2, 6, 8)  →  (2, 6, 10)</text><text x="350" y="222" font-size="14" fill="#26354a" text-anchor="middle">权重数 = 8 × 10 = 80；位置数不参与参数计数。</text></svg>
