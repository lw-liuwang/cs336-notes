<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 245" role="img" aria-label="箭头表示计算依赖和反向求导的方向；求梯度本身不执行参数更新。"><style>svg{background:#f8fafc;color:#26354a;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}text{font-family:inherit}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#536d92"/></marker></defs><rect x="45" y="35" width="185" height="54" rx="7" fill="#edf3fc" stroke="#bccbdc"/><text x="137.5" y="67" font-size="15" fill="#26354a" text-anchor="middle">参数 w = 2</text><rect x="435" y="35" width="210" height="54" rx="7" fill="#edf3fc" stroke="#bccbdc"/><text x="540" y="67" font-size="15" fill="#26354a" text-anchor="middle">L = (w − 3)² = 1</text><path d="M230,60 L430,60" fill="none" stroke="#536d92" stroke-width="2" marker-end="url(#arrow)"/><text x="330" y="46" font-size="14" fill="#26354a" text-anchor="middle">前向</text><path d="M540 95 L540 151 L230 151" fill="none" stroke="#536d92" stroke-width="2" marker-end="url(#arrow)"/><text x="410" y="136" font-size="14" fill="#26354a" text-anchor="middle">反向：2(w − 3) = −2</text><rect x="45" y="125" width="185" height="54" rx="7" fill="#e0f1eb" stroke="#bccbdc"/><text x="137.5" y="157" font-size="15" fill="#26354a" text-anchor="middle">梯度 g = −2</text><text x="350" y="215" font-size="16" fill="#26354a" text-anchor="middle">反向传播写入梯度；此时 w 仍然是 2。</text></svg>
