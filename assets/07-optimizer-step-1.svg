<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 150" role="img" aria-label="本图是学习率 0.1 的独立更新示例。"><style>svg{background:#f8fafc;color:#26354a;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}text{font-family:inherit}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#536d92"/></marker></defs><rect x="30" y="35" width="180" height="54" rx="7" fill="#edf3fc" stroke="#bccbdc"/><text x="120" y="67" font-size="15" fill="#26354a" text-anchor="middle">旧 w = 2</text><path d="M210,62 L270,62" fill="none" stroke="#536d92" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="35" width="180" height="54" rx="7" fill="#edf3fc" stroke="#bccbdc"/><text x="365" y="67" font-size="15" fill="#26354a" text-anchor="middle">减去 0.1 × (−2)</text><path d="M455,62 L510,62" fill="none" stroke="#536d92" stroke-width="2" marker-end="url(#arrow)"/><rect x="515" y="35" width="150" height="54" rx="7" fill="#edf3fc" stroke="#bccbdc"/><text x="590" y="67" font-size="15" fill="#26354a" text-anchor="middle">新 w = 2.2</text><text x="350" y="130" font-size="14" fill="#26354a" text-anchor="middle">梯度为负：减去负数，参数沿增大的方向移动。</text></svg>
