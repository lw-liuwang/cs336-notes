<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 180" role="img" aria-label="两块宽度按容量等比例绘制；梯度存在后，要把它与参数分别计入。"><style>svg{background:#f8fafc;color:#26354a;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}text{font-family:inherit}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#536d92"/></marker></defs><text x="350" y="22" font-size="15" fill="#26354a" text-anchor="middle">参数和梯度是两份不同数据</text><rect x="50" y="45" width="300" height="60" rx="7" fill="#edf3fc" stroke="#bccbdc"/><text x="200" y="80" font-size="15" fill="#26354a" text-anchor="middle">参数：80 × 4 = 320 字节</text><rect x="350" y="45" width="300" height="60" rx="7" fill="#e0f1eb" stroke="#bccbdc"/><text x="500" y="80" font-size="15" fill="#26354a" text-anchor="middle">梯度：80 × 4 = 320 字节</text><text x="350" y="153" font-size="18" fill="#26354a" text-anchor="middle">只计这两项：320 + 320 = 640 字节</text></svg>
