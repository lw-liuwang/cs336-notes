<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" role="img" aria-label="两条激活容量采用相同尺度；单个 h 的数据量不能代表整次训练的全部显存。"><style>svg{background:#f8fafc;color:#26354a;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}text{font-family:inherit}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#536d92"/></marker></defs><text x="350" y="22" font-size="15" fill="#26354a" text-anchor="middle">序列长 6、输出宽度 10、FP32；只改变 B</text><text x="70" y="76" font-size="14" fill="#26354a" text-anchor="middle">B = 2</text><rect x="130" y="50" width="230" height="40" rx="7" fill="#e0f1eb" stroke="#bccbdc"/><text x="245" y="75" font-size="15" fill="#26354a" text-anchor="middle">激活 480 字节</text><text x="70" y="135" font-size="14" fill="#26354a" text-anchor="middle">B = 4</text><rect x="130" y="109" width="460" height="40" rx="7" fill="#e0f1eb" stroke="#bccbdc"/><text x="360" y="134" font-size="15" fill="#26354a" text-anchor="middle">激活 960 字节</text><text x="350" y="198" font-size="15" fill="#26354a" text-anchor="middle">两种情况共享同一个 8 × 10 权重矩阵</text><text x="350" y="235" font-size="14" fill="#26354a" text-anchor="middle">权重仍是 80 个数；增长的是本批中间结果。</text></svg>
