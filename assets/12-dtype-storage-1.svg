<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 180" role="img" aria-label="条长采用同一字节尺度；格式转换生成的近似值不保证与原值完全相同。"><style>svg{background:#f8fafc;color:#26354a;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}text{font-family:inherit}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#536d92"/></marker></defs><text x="350" y="22" font-size="15" fill="#26354a" text-anchor="middle">相同 80 个元素，数值表示宽度不同</text><text x="70" y="67" font-size="14" fill="#26354a" text-anchor="middle">FP32</text><rect x="130" y="42" width="500" height="36" rx="7" fill="#edf3fc" stroke="#bccbdc"/><text x="380" y="65" font-size="15" fill="#26354a" text-anchor="middle">320 字节</text><text x="70" y="124" font-size="14" fill="#26354a" text-anchor="middle">BF16</text><rect x="130" y="99" width="250" height="36" rx="7" fill="#e0f1eb" stroke="#bccbdc"/><text x="255" y="122" font-size="15" fill="#26354a" text-anchor="middle">160 字节</text><text x="350" y="171" font-size="14" fill="#26354a" text-anchor="middle">元素数量与形状不变；精度和可表示数值会改变。</text></svg>
