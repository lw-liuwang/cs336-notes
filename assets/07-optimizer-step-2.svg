<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 285" role="img" aria-label="箭头表示读写或引用关系；step 不会重新调用 backward。"><style>svg{background:#f8fafc;color:#26354a;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}text{font-family:inherit}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#536d92"/></marker></defs><rect x="255" y="105" width="200" height="76" rx="7" fill="white" stroke="#bccbdc"/><text x="355" y="133" font-size="15" fill="#26354a" text-anchor="middle">同一个参数对象 w</text><text x="355" y="161" font-size="14" fill="#26354a" text-anchor="middle">数值：2   ·   grad：−2</text><rect x="20" y="20" width="220" height="49" rx="7" fill="#edf3fc" stroke="#bccbdc"/><text x="130" y="49.5" font-size="15" fill="#26354a" text-anchor="middle">loss.backward()</text><path d="M130 69 L130 145 L250 145" fill="none" stroke="#536d92" stroke-width="2" marker-end="url(#arrow)"/><text x="145" y="96" font-size="13" fill="#26354a" text-anchor="middle">求导后写入 grad</text><rect x="470" y="20" width="210" height="49" rx="7" fill="#edf3fc" stroke="#bccbdc"/><text x="575" y="49.5" font-size="15" fill="#26354a" text-anchor="middle">optimizer.step()</text><path d="M455 145 L575 145 L575 74" fill="none" stroke="#536d92" stroke-width="2" marker-end="url(#arrow)"/><text x="575" y="177" font-size="13" fill="#26354a" text-anchor="middle">读取 grad，改写 w</text><rect x="420" y="220" width="260" height="42" rx="7" fill="#edf3fc" stroke="#bccbdc"/><text x="550" y="246" font-size="15" fill="#26354a" text-anchor="middle">初始化优化器：登记 w 的引用</text><path d="M420 240 L355 240 L355 187" fill="none" stroke="#536d92" stroke-width="2" marker-end="url(#arrow)"/><text x="350" y="277" font-size="14" fill="#26354a" text-anchor="middle">连接两次调用的是参数对象上的梯度存储。</text></svg>
